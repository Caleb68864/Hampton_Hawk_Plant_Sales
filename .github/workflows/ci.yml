name: CI

# This repository had no workflows and had never run a single Actions job. That
# is the direct reason a PR could claim "vitest 209/0" over 7 failures, and why
# `forge-project.json`'s test command covering only the API went unnoticed for
# months: nothing ever ran the web suite.
#
# `pull_request` is the trigger that matters here. A workflow that only fires on
# pushes to the default branch protects nothing, because it first runs after the
# merge it was supposed to gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Matches api/Dockerfile's mcr.microsoft.com/dotnet/sdk:9.0.
          dotnet-version: '9.0.x'

      - run: dotnet restore HamptonHawksPlantSales.sln

      - run: dotnet build HamptonHawksPlantSales.sln --no-restore -c Release

      # Includes the SQLite-backed constraint tests. The rest of the suite runs
      # on EF InMemory, which enforces no unique index, FK or check constraint --
      # see CLAUDE.md. No test here touches real Postgres.
      - run: dotnet test HamptonHawksPlantSales.sln --no-build -c Release --logger "console;verbosity=normal"

  web:
    name: Web (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        # 22 is what web/Dockerfile ships and what .nvmrc pins. 26 is what
        # developers here actually have, and it is the version that removes
        # `globalThis.localStorage` from under vitest (see web/vitest.setup.ts).
        # Both legs run so that "works on my machine" is a falsifiable claim.
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      # node:test for src/**/*.test.ts, then vitest for src/**/__tests__/.
      # `npm test` runs both; running them separately makes the log say which
      # half failed.
      - name: Unit tests (node:test)
        run: npm run test:node

      - name: Component tests (vitest)
        run: npm run test:vitest
