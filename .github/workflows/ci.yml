name: CI

# This repository had no workflows and had never run a single Actions job. That
# is the direct reason a PR could claim "vitest 209/0" over 7 failures, and why
# `forge-project.json`'s test command covering only the API went unnoticed for
# months: nothing ever ran the web suite.
#
# `pull_request` is the trigger that matters here. A workflow that only fires on
# pushes to the default branch protects nothing, because it first runs after the
# merge it was supposed to gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Matches api/Dockerfile's mcr.microsoft.com/dotnet/sdk:9.0.
          dotnet-version: '9.0.x'

      - run: dotnet restore HamptonHawksPlantSales.sln

      - run: dotnet build HamptonHawksPlantSales.sln --no-restore -c Release

      # Includes the SQLite-backed constraint tests. The rest of the suite runs
      # on EF InMemory, which enforces no unique index, FK or check constraint --
      # see CLAUDE.md. Nothing in this job touches Docker or Postgres: the
      # PostgresTests project builds here and reports its tests as skipped, and
      # the api-postgres job below is where they run.
      - run: dotnet test HamptonHawksPlantSales.sln --no-build -c Release --logger "console;verbosity=normal"

  api-postgres:
    name: API against real Postgres (Testcontainers)
    # A separate job so a Docker or registry hiccup here shows up as its own red
    # X and cannot hide, or be hidden by, a unit-test failure in the job above.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    env:
      HH_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Docker is available
        run: docker version

      - run: dotnet build tests/HamptonHawksPlantSales.PostgresTests -c Release

      # Row locks (SELECT ... FOR UPDATE), SERIALIZABLE retries and Postgres error
      # codes -- the behaviour that decides whether two stations can oversell or
      # double-pick. None of it exists on the providers the unit tests use.
      - name: Test against PostgreSQL 16
        run: >-
          dotnet test tests/HamptonHawksPlantSales.PostgresTests --no-build -c Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=postgres.trx"
          --results-directory TestResults/postgres

      # The tests skip themselves when HH_POSTGRES_TESTS is unset so that a plain
      # `dotnet test` works without Docker. Here a skip would make this job a
      # green no-op, so any skipped test -- or a suspiciously small count -- fails it.
      - name: Every Postgres test really ran
        run: python3 ../.github/scripts/assert_tests_ran.py TestResults/postgres/postgres.trx 14

  compose:
    name: Compose stack (docker compose up)
    # Proves the README's start command: build the images, start postgres + api +
    # web the way a volunteer would, and check the app actually answers -- through
    # the API directly, through the web container's proxy, and with a real login
    # against the migrated database.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Docker and Compose versions
        run: |
          docker version
          docker compose version

      # docker-compose.override.yml uses the `!override` YAML tag, which Compose
      # only understands from v2.24.0. Older versions reject the file outright.
      - name: Compose is new enough for docker-compose.override.yml
        run: |
          have="$(docker compose version --short)"
          need="2.24.0"
          lowest="$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)"
          echo "Compose $have (need >= $need)"
          test "$lowest" = "$need"

      # The override must *replace* postgres' published port, not add to it.
      # If `!override` were ignored, 5432 would still be published and would
      # collide with a Postgres already running on the host.
      - name: Override replaces the postgres port instead of merging
        run: |
          docker compose config --format json > "$RUNNER_TEMP/compose.json"
          python3 -c '
          import json, sys
          ports = json.load(open(sys.argv[1]))["services"]["postgres"]["ports"]
          published = sorted(str(p.get("published")) for p in ports)
          print("postgres publishes:", published)
          assert published == ["5433"], published
          ' "$RUNNER_TEMP/compose.json"

      # The README's command, detached so the job can go on to probe the stack.
      - name: docker compose up --build
        run: docker compose up --build --detach

      # /health includes an Npgsql check, and the API only starts listening after
      # its startup migrations finish, so "Healthy" here means migrated and connected.
      - name: API is healthy (and so can reach Postgres)
        run: |
          body="$(curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/health)"
          echo "GET :8080/health -> $body"
          test "$body" = "Healthy"

      - name: Web serves the app shell
        run: |
          curl -fsS http://localhost:3000/ -o "$RUNNER_TEMP/index.html"
          grep -q '<div id="root">' "$RUNNER_TEMP/index.html"
          # Deep links fall back to the SPA rather than 404 (nginx try_files).
          curl -fsS http://localhost:3000/pickup | grep -q '<div id="root">'

      - name: Web proxies /api through to the API
        run: |
          body="$(curl -fsS http://localhost:3000/api/health)"
          echo "GET :3000/api/health -> $body"
          test "$body" = "Healthy"

      # Logging in needs the migrated schema and the bootstrap admin the API
      # seeds on first start, so this is the first check that exercises the
      # database rather than just a connection to it.
      - name: Bootstrap admin can log in through the web proxy
        run: |
          curl -sS -D "$RUNNER_TEMP/login.headers" -o "$RUNNER_TEMP/login.json" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"changeme"}' \
            http://localhost:3000/api/auth/login
          cat "$RUNNER_TEMP/login.json"; echo
          grep -i '^set-cookie:' "$RUNNER_TEMP/login.headers"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["success"] and r["data"]["username"]=="admin", r' "$RUNNER_TEMP/login.json"
          cookie="$(grep -i '^set-cookie: HH.Session=' "$RUNNER_TEMP/login.headers" | head -n1 | sed -E 's/^[Ss]et-[Cc]ookie: ([^;]+).*/\1/')"
          test -n "$cookie"
          me="$(curl -fsS -H "Cookie: $cookie" http://localhost:3000/api/auth/me)"
          echo "GET /api/auth/me -> $me"
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert r["success"] and r["data"]["username"]=="admin", r' "$me"

      # The compose file's own healthchecks are what `docker compose ps`, Portainer
      # and `depends_on: condition: service_healthy` rely on. A check that can never
      # pass would report a working API as down (and a real outage as nothing new).
      - name: Compose healthchecks report healthy
        run: |
          for service in postgres api; do
            id="$(docker compose ps -q "$service")"
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
              [ "$status" = "healthy" ] && break
              [ "$status" = "unhealthy" ] && break
              sleep 5
            done
            echo "$service: $status"
            if [ "$status" != "healthy" ]; then
              docker inspect --format '{{json .State.Health}}' "$id"
              exit 1
            fi
          done

      # The login step above replays the cookie with an explicit `Cookie:` header,
      # which bypasses every rule a browser applies to a cookie. That is exactly how
      # a Secure-only session cookie shipped while the laptop kept working: the
      # laptop browses http://localhost, and localhost is the one http origin that is
      # allowed to keep a Secure cookie. The phones that scan the /connect-mobile QR
      # reach the laptop by LAN address, where that exemption does not apply.
      #
      # These two steps use a real cookie jar (-c/-b) against the runner's own
      # non-loopback address. curl's cookie engine implements the same Secure rule and
      # the same localhost carve-out a browser does, so it stands in for the phone.
      - name: Find a non-loopback address to stand in for the phone
        id: lan
        run: |
          host="$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for (i = 1; i <= NF; i++) if ($i == "src") print $(i + 1)}' | head -n1)"
          echo "runner address: ${host:-<none>}"
          # Falling back to localhost here would turn this into a test that always
          # passes, which is worse than not having it.
          test -n "$host"
          case "$host" in 127.*|"") echo "loopback only -- cannot prove the phone case"; exit 1;; esac
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Flag off, a phone on the LAN is logged out immediately
        env:
          HOST: ${{ steps.lan.outputs.host }}
        run: |
          jar="$RUNNER_TEMP/phone-off.jar"
          rm -f "$jar"
          curl -sS -c "$jar" -D "$RUNNER_TEMP/off.headers" -o "$RUNNER_TEMP/off.json" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"changeme"}' \
            "http://$HOST:3000/api/auth/login"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["success"], r' "$RUNNER_TEMP/off.json"
          # The login itself succeeds. The cookie is the problem.
          python3 .github/scripts/assert_session_cookie.py "$RUNNER_TEMP/off.headers" secure
          # A Secure cookie from a non-localhost http origin is dropped on the floor,
          # so nothing was stored to send back.
          if grep -q 'HH.Session' "$jar"; then
            echo "expected the client to refuse to store the Secure cookie"; cat "$jar"; exit 1
          fi
          code="$(curl -sS -b "$jar" -o "$RUNNER_TEMP/off.me.json" -w '%{http_code}' "http://$HOST:3000/api/auth/me")"
          echo "GET /api/auth/me from $HOST -> $code"
          test "$code" = "401"

      # This proves the http half only. The stack has no TLS, so "an https request
      # still gets a Secure cookie" is not something this job can honestly check --
      # that control lives in SessionCookieSecurityTests, which drives the same
      # Program.cs over an https scheme.
      - name: Flag on, that same phone stays logged in
        env:
          HOST: ${{ steps.lan.outputs.host }}
        run: |
          printf 'Session__AllowInsecureCookieOverHttp=true\n' > .env
          docker compose up --detach --force-recreate api
          # Through the proxy, so this also waits out nginx's cached upstream IP.
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:3000/api/health

          # The opt-in has to be impossible to miss in `docker compose logs`.
          docker compose logs --no-color api | grep 'SECURITY' | grep -q 'Session__AllowInsecureCookieOverHttp'

          jar="$RUNNER_TEMP/phone-on.jar"
          rm -f "$jar"
          curl -sS -c "$jar" -D "$RUNNER_TEMP/on.headers" -o "$RUNNER_TEMP/on.json" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"changeme"}' \
            "http://$HOST:3000/api/auth/login"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["success"], r' "$RUNNER_TEMP/on.json"
          python3 .github/scripts/assert_session_cookie.py "$RUNNER_TEMP/on.headers" insecure
          grep -q 'HH.Session' "$jar"

          me="$(curl -fsS -b "$jar" "http://$HOST:3000/api/auth/me")"
          echo "GET /api/auth/me from $HOST -> $me"
          python3 -c 'import json,sys; r=json.loads(sys.argv[1]); assert r["success"] and r["data"]["username"]=="admin", r' "$me"

          # And back off again, so a green run cannot mean the flag got stuck on.
          rm -f .env
          docker compose up --detach --force-recreate api
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://localhost:3000/api/health
          curl -sS -D "$RUNNER_TEMP/again.headers" -o /dev/null \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"changeme"}' \
            "http://$HOST:3000/api/auth/login"
          python3 .github/scripts/assert_session_cookie.py "$RUNNER_TEMP/again.headers" secure

      - name: Container state
        if: always()
        run: docker compose ps --all

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  web:
    name: Web (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        # 22 is what web/Dockerfile ships and what .nvmrc pins. 26 is what
        # developers here actually have, and it is the version that removes
        # `globalThis.localStorage` from under vitest (see web/vitest.setup.ts).
        # Both legs run so that "works on my machine" is a falsifiable claim.
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      # node:test for src/**/*.test.ts, then vitest for src/**/__tests__/.
      # `npm test` runs both; running them separately makes the log say which
      # half failed.
      - name: Unit tests (node:test)
        run: npm run test:node

      - name: Component tests (vitest)
        run: npm run test:vitest
